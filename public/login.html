<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · OpenBot</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0a0a0a" />
  <style>
    :root { color-scheme: dark; --bg: #0a0a0a; --card: #141416; --line: #26262b; --text: #f2f2f3; --muted: #9a9aa3; --accent: #8b6cff; --err: #ff6b6b; }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f6f6f7; --card: #fff; --line: #e3e3e8; --text: #111114; --muted: #5d5d66; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 16px; -webkit-app-region: drag; }
    form { -webkit-app-region: no-drag; width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; }
    .logo { width: 48px; height: 48px; display: block; margin-bottom: 18px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    input { display: block; width: 100%; margin-top: 6px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 10px; background: var(--text); color: var(--bg); font: 600 15px/1 inherit; cursor: pointer; }
    button[disabled] { opacity: .6; cursor: progress; }
    .err { color: var(--err); font-size: 13px; min-height: 20px; margin: 8px 0 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <form id="f" novalidate>
    <img class="logo" src="/img/logo.svg" alt="" />
    <h1 id="title">Sign in to OpenBot</h1>
    <p id="sub">Your team's AI crew is waiting.</p>
    <label class="hidden" id="nameRow">Your name<input id="name" autocomplete="name" /></label>
    <label>Username<input id="username" autocomplete="username" required autofocus /></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8" /></label>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const next = new URLSearchParams(location.search).get('next');
    const dest = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
    const me = await fetch('/api/auth/me').then((r) => r.json()).catch(() => ({}));
    if (me.user || me.enabled === false) location.replace(dest);
    const setup = me.needsSetup;
    if (setup) {
      $('title').textContent = 'Create the admin account';
      $('sub').textContent = 'This first account manages the team, settings and bridges.';
      $('nameRow').classList.remove('hidden');
      $('password').autocomplete = 'new-password';
      $('go').textContent = 'Create account';
    }
    $('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('err').textContent = '';
      $('go').disabled = true;
      try {
        const r = await fetch(setup ? '/api/auth/setup' : '/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value, name: $('name').value.trim() }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Something went wrong');
        location.replace(dest);
      } catch (err) { $('err').textContent = err.message; $('go').disabled = false; }
    });
  </script>
</body>
</html>
